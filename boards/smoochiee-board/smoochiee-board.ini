; ============================================================================
; File: boards/smoochiee-board/smoochiee-board.ini
; Board: Smoochiee (ESP32-S3) - Bruce/Marauder Firmware
; Fix: USB-CDC, PSRAM, LittleFS, & pin array defines
; ============================================================================

[env:smoochiee-board]
; --- Board Definition ---
board = smoochiee-board
; ⚠️ Pastikan file 'boards/smoochiee-board.json' ADA (lihat catatan di bawah)

; --- Source Filter ---
build_src_filter = ${env.build_src_filter} +<../boards/smoochiee-board>

; --- Memory & Flash Config ---
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

; --- Partition & Filesystem ---
; ⚠️ Opsi 1: Pakai custom_16Mb.csv (harus ada di root project)
board_build.partitions = custom_16Mb.csv
; ⚠️ Opsi 2 (jika custom_16Mb.csv nggak ada): ganti ke default_16MB.csv
; board_build.partitions = default_16MB.csv

; ✅ WAJIB: Aktifkan LittleFS buat theme.json, config.json, dll
board_build.filesystem = littlefs

; --- Build Flags ---
build_flags =
	${env.build_flags}
	-Iboards/smoochiee-board
	
	; ✅ Optimasi size
	-Os
	
	; ✅ Debug level (1=error, 2=warn, 3=info)
	-DCORE_DEBUG_LEVEL=1
	
	; ✅ ESP32-S3 USB-CDC: WAJIB biar Serial Monitor jalan via USB native
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	
	; ✅ PSRAM: WAJIB buat board dengan OPI PSRAM
	-DBOARD_HAS_PSRAM
	-DCONFIG_SPIRAM_IGNORE_NOTFOUND
	
	; ✅ HSPI Port untuk modul eksternal (CC1101, NRF24, dll)
	-DUSE_HSPI_PORT=1
	
	; ✅ Device Name
	-DDEVICE_NAME='"Smoochiee Board"'
	
	; ✅ Buzzer & Mic config
	-DBUZZ_PIN=44
	-DMIC_INMP441
	
	; ✅ Pin Arrays untuk IR/RF (format JSON string)
	; Tambah -DBRUCE_PIN_ARRAYS biar firmware parse array ini
	-DBRUCE_PIN_ARRAYS
	-DIR_TX_PINS='{{"M5 IR Mod", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 5", 5}, {"GPIO 2", 2}}'
	-DIR_RX_PINS='{{"M5 IR Mod", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 4", 4}, {"GPIO 2", 2}}'
	-DRF_TX_PINS='{{"M5 RF433T", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 1", 1}, {"GPIO 2", 2}}'
	-DRF_RX_PINS='{{"M5 RF433R", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 1", 1}, {"GPIO 2", 2}}'

; --- Library Dependencies ---
lib_deps =
	${env.lib_deps}
	lewisxhe/XPowersLib @0.3.0
	; Tambah kalau firmware butuh:
	; bblanchon/ArduinoJson @6.21.3
	; lovyan03/LovyanGFX @1.1.12

; --- Upload & Monitor ---
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, colorize
; upload_port = COMx  ; Windows: sesuaikan port
; upload_port = /dev/ttyACM0  ; Linux/Mac

; --- Extra Scripts (Opsional: auto upload filesystem) ---
; extra_scripts = pre:extra_script.py
