; ============================================================================
; File: boards/smoochiee-board/smoochiee-board.ini
; Board: Smoochiee (ESP32-S3)
; Fix: Filesystem, USB-CDC, PSRAM, & partition config
; ============================================================================

[env:smoochiee-board]
; --- Board Definition ---
board = smoochiee-board
; Pastikan file 'boards/smoochiee-board.json' ada dengan specs ESP32-S3!

; --- Source Filter ---
build_src_filter = ${env.build_src_filter} +<../boards/smoochiee-board>

; --- Memory & Flash Config ---
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

; ✅ PARTISI: Pastikan file custom_16Mb.csv ADA di folder project!
; Jika nggak ada, ganti ke: default_16MB.csv atau littlefs_16MB.csv
board_build.partitions = custom_16Mb.csv

; ✅ FILESYSTEM: WAJIB buat theme.json, config.json, dll
board_build.filesystem = littlefs

; --- Build Flags ---
build_flags =
	${env.build_flags}
	-Iboards/smoochiee-board
	
	; ✅ Optimasi size
	-Os
	
	; ✅ Debug level (1=error, 2=warn, 3=info, 4=debug, 5=verbose)
	-DCORE_DEBUG_LEVEL=1
	
	; ✅ ESP32-S3 USB-CDC: WAJIB biar Serial Monitor jalan via USB
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	
	; ✅ PSRAM: WAJIB buat board dengan OPI PSRAM
	-DBOARD_HAS_PSRAM
	-DCONFIG_SPIRAM_IGNORE_NOTFOUND
	
	; ✅ HSPI Port untuk modul eksternal (CC1101, NRF24, dll)
	-DUSE_HSPI_PORT=1
	
	; ✅ Device Name
	-DDEVICE_NAME='"Smoochiee Board"'
	
	; ✅ Buzzer & Mic
	-DBUZZ_PIN=44
	-DMIC_INMP441
	
	; ✅ IR/RF Pin Arrays (format JSON string untuk firmware)
	-DBRUCE_PIN_ARRAYS
	-DIR_TX_PINS='{{"M5 IR Mod", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 5", 5}, {"GPIO 2", 2}}'
	-DIR_RX_PINS='{{"M5 IR Mod", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 4", 4}, {"GPIO 2", 2}}'
	-DRF_TX_PINS='{{"M5 RF433T", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 1", 1}, {"GPIO 2", 2}}'
	-DRF_RX_PINS='{{"M5 RF433R", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 1", 1}, {"GPIO 2", 2}}'

; --- Library Dependencies ---
lib_deps =
	${env.lib_deps}
	lewisxhe/XPowersLib @0.3.0
	; Tambah library lain kalau perlu:
	; bblanchon/ArduinoJson @6.21.3
	; lovyan03/LovyanGFX @1.1.12

; --- Upload & Monitor Config ---
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, colorize
; upload_port = COMx  ; Uncomment & sesuaikan port lu (Windows)
; upload_port = /dev/ttyACM0  ; Linux/Mac

; --- Extra Scripts (Opsional: auto upload filesystem) ---
; extra_scripts = 
;     pre:extra_script.py
