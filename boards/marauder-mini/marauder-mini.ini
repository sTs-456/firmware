; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storage
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:Marauder-Mini]
board = esp32dev
board_build.partitions = custom_4Mb_full.csv
build_src_filter = ${env.build_src_filter} +<../boards/marauder-mini>
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}

	-Iboards/marauder-mini

	-D MARAUDER_MINI
	-DUSER_SETUP_LOADED=1
	-DST7735_DRIVER=1
	-DST7735_GREENTAB
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_WIDTH=128
	-DTFT_HEIGHT=160
	
	; ===== TFT ST7735 Pinout =====
	-DTFT_MISO=-1              ; ⚠️ ST7735 write-only, JANGAN pakai MISO!
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_BL=32
	-DTFT_CS=17
	-DTFT_DC=16
	-DTFT_RST=-1               ; Auto-reset, atau ganti 25 kalau perlu
	-DTFT_BACKLIGHT_ON=LOW
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=16000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DTOUCH_CS=-1

	; ===== SD Card Pinout (Shared SPI) =====
	-DSDCARD_CS=4
	-DSDCARD_SCK=18
	-DSDCARD_MISO=19
	-DSDCARD_MOSI=23

	; ===== CC1101 Pinout (Shared SPI) =====
	-DCC1101_GDO0=14
	-DCC1101_SS=5
	-DCC1101_SCK=18
	-DCC1101_MOSI=23
	-DCC1101_MISO=19

	; ===== NRF24L01 Pinout (Shared SPI) =====
	-DNRF24_CE=2
	-DNRF24_SS=15
	-DNRF24_SCK=18
	-DNRF24_MOSI=23
	-DNRF24_MISO=19

	; ===== RFID RC522 Pinout (Shared SPI) =====
	-DRFID_SS=27
	-DRFID_RST=13
	-DRFID_IRQ=12
	-DRFID_SCK=18
	-DRFID_MOSI=23
	-DRFID_MISO=19

	; ===== Enable All Modules =====
	-DENABLE_CC1101=1
	-DENABLE_NRF24=1
	-DENABLE_RFID=1

	-DDEVICE_NAME='"Marauder mini"'

lib_deps =
	${env.lib_deps}

lib_ignore =
	${env_4mb.lib_ignore}


[env:Awok-Mini]
extends = env:Marauder-Mini
board_build.partitions = custom_16Mb.csv
board_upload.maximum_size = 16777216
board_upload.flash_size=16MB


[env:Marauder-v7]
board = esp32dev
board_build.partitions = custom_4Mb_full.csv
build_src_filter = ${env.build_src_filter} +<../boards/marauder-mini>
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}
	-Iboards/marauder-mini

	-D MARAUDER_MINI
	-DUSER_SETUP_LOADED=1
	-DILI9341_DRIVER=1
	-DUSE_HSPI_PORT=1
	-DTFT_HEIGHT=320
	-DTFT_WIDTH=240
	-DTFT_MISO=19
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_CS=17
	-DTFT_DC=26
	-DTFT_RST=-1
	-DTFT_BL=32
	-DTFT_BACKLIGHT_ON=HIGH
	-DSMOOTH_FONT=1
	-DTOUCH_CS=-1
	-DSPI_FREQUENCY=27000000
	-DDEVICE_NAME='"Marauder v7"'

lib_deps =
	${env.lib_deps}

lib_ignore =
	${env_4mb.lib_ignore}


[env:LAUNCHER_Marauder-Mini]
extends=env:Marauder-Mini
board_build.partitions = custom_4Mb.csv
build_flags =
	${env:Marauder-Mini.build_flags}
	${env_light.build_flags}
lib_deps =
	${env_light.lib_deps}


[env:LAUNCHER_Marauder-v7]
extends=env:Marauder-v7
board_build.partitions = custom_4Mb.csv
build_flags =
	${env:Marauder-v7.build_flags}
	${env_light.build_flags}
lib_deps =
	${env_light.lib_deps}
